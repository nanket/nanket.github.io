<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nanket Games creates playful mobile experiences, including Stack &amp; Smash.">
  <title>Nanket Games</title>
  <style>
    :root { color-scheme: light; --ink:#302218; --muted:#756357; --sand:#fff8eb; --card:#fffdf8; --orange:#ef7d22; --line:#eadcc8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); background:linear-gradient(155deg,#ffd698 0,#fff8eb 48%,#d9f0ff 100%); font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(760px,calc(100% - 32px)); margin:48px auto; padding:clamp(30px,7vw,64px); background:var(--card); border:1px solid rgba(120,77,35,.15); border-radius:30px; box-shadow:0 26px 80px rgba(98,55,22,.15); }
    .eyebrow { margin:0 0 8px; color:var(--orange); font-size:.8rem; font-weight:850; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.6rem,9vw,5rem); line-height:.98; letter-spacing:-.055em; }
    .lead { max-width:560px; margin:22px 0 32px; color:var(--muted); font-size:1.12rem; }
    .game { padding:24px; border:1px solid var(--line); border-radius:22px; background:#fffaf0; }
    .game h2 { margin:0 0 6px; font-size:1.35rem; }
    .game p { margin:0 0 16px; color:var(--muted); }
    a { color:#a9490d; font-weight:720; text-underline-offset:3px; }
    footer { margin-top:34px; color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Independent mobile games</p>
    <h1>Nanket Games</h1>
    <p class="lead">We build bright, tactile games designed around quick play, readable controls, and satisfying progression.</p>
    <section class="game">
      <h2>Stack &amp; Smash</h2>
      <p>Collect, build, dodge, jump, and turn every surviving block into a spectacular finish.</p>
      <a href="https://nanket.github.io/stack-and-smash-privacy/">Privacy policy</a>
    </section>
    <footer>© 2026 Nanket Games</footer>
  </main>
</body>
</html>
